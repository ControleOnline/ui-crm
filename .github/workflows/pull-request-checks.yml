name: Pull Request Checks

on:
  pull_request:
  push:
    branches:
      - task-*

jobs:
  crm-home-shortcut-subtitles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify CRM home shortcut subtitle styling
        run: node --test src/tests/react/pages/homeShortcutSubtitle.test.cjs

      - name: Validate diff formatting
        run: git diff --check
